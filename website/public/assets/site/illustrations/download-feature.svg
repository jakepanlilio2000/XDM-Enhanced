<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="streamGrad1" x1="50" y1="0" x2="350" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="streamGrad2" x1="50" y1="0" x2="350" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="featShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Illustration Card Frame -->
  <rect x="15" y="15" width="370" height="270" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#featShadow)" />

  <!-- Download File Container -->
  <g transform="translate(145, 45)">
    <rect x="0" y="0" width="110" height="130" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <path d="M 0 35 L 110 35" stroke="#1E293B" stroke-width="2" />
    <circle cx="20" cy="18" r="4" fill="#EF4444" />
    <circle cx="34" cy="18" r="4" fill="#F59E0B" />
    <circle cx="48" cy="18" r="4" fill="#10B981" />
    <!-- Down Arrow Inside Container -->
    <path d="M 55 55 L 55 105 M 40 90 L 55 105 L 70 90" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Parallel Segment Streams (Multi-Connection Acceleration) -->
  <g>
    <!-- Stream 1 -->
    <rect x="40" y="195" width="320" height="8" rx="4" fill="#334155" />
    <rect x="40" y="195" width="260" height="8" rx="4" fill="url(#streamGrad1)" />
    <!-- Stream 2 -->
    <rect x="40" y="215" width="320" height="8" rx="4" fill="#334155" />
    <rect x="40" y="215" width="290" height="8" rx="4" fill="url(#streamGrad2)" />
    <!-- Stream 3 -->
    <rect x="40" y="235" width="320" height="8" rx="4" fill="#334155" />
    <rect x="40" y="235" width="220" height="8" rx="4" fill="url(#streamGrad1)" />
    <!-- Stream 4 -->
    <rect x="40" y="255" width="320" height="8" rx="4" fill="#334155" />
    <rect x="40" y="255" width="310" height="8" rx="4" fill="url(#streamGrad2)" />
  </g>

  <!-- Segment Speed Badge -->
  <g transform="translate(260, 30)">
    <rect x="0" y="0" width="105" height="26" rx="13" fill="#0369A1" />
    <text x="52" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F0F9FF" text-anchor="middle">8× DYNAMIC</text>
  </g>
</svg>

