<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="torCardGrad" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="15" y="15" width="370" height="270" rx="16" fill="url(#torCardGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Center Swarm Hub -->
  <circle cx="200" cy="140" r="60" fill="url(#centerGlow)" />
  <circle cx="200" cy="140" r="32" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />

  <!-- Magnet Icon Inside Hub -->
  <path d="M 190 128 L 190 142 C 190 148, 210 148, 210 142 L 210 128 M 186 128 L 194 128 M 206 128 L 214 128" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Swarm Interconnect Lines -->
  <path d="M 200 140 L 90 80 M 200 140 L 310 80 M 200 140 L 80 200 M 200 140 L 320 200 M 200 140 L 200 240 M 200 140 L 200 45" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.7" />

  <!-- Peer Nodes -->
  <g fill="url(#nodeGrad)">
    <circle cx="90" cy="80" r="14" />
    <circle cx="310" cy="80" r="14" />
    <circle cx="80" cy="200" r="12" />
    <circle cx="320" cy="200" r="12" />
    <circle cx="200" cy="45" r="10" />
    <circle cx="200" cy="240" r="15" />
  </g>

  <!-- Labels -->
  <text x="200" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">BITTORRENT 2.0 &amp; DHT SWARM</text>
</svg>

