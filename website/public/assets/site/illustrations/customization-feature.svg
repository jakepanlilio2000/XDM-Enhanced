<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="custCardGrad" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="paletteGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="paletteGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <rect x="15" y="15" width="370" height="270" rx="16" fill="url(#custCardGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Split Window (Light vs Dark UI) -->
  <g transform="translate(60, 50)">
    <!-- Light Side (Left) -->
    <path d="M 0 10 C 0 4, 4 0, 10 0 L 140 0 L 140 140 L 10 140 C 4 140, 0 136, 0 130 Z" fill="#F8FAFC" />
    <circle cx="20" cy="15" r="4" fill="#EF4444" />
    <circle cx="34" cy="15" r="4" fill="#F59E0B" />
    <circle cx="48" cy="15" r="4" fill="#10B981" />
    <rect x="15" y="40" width="110" height="12" rx="3" fill="#E2E8F0" />
    <rect x="15" y="62" width="90" height="10" rx="3" fill="#E2E8F0" />
    <rect x="15" y="82" width="100" height="10" rx="3" fill="#E2E8F0" />

    <!-- Dark Side (Right) -->
    <path d="M 140 0 L 270 0 C 276 0, 280 4, 280 10 L 280 130 C 280 136, 276 140, 270 140 L 140 140 Z" fill="#0A0F1D" />
    <rect x="155" y="40" width="110" height="12" rx="3" fill="#1E293B" />
    <rect x="155" y="62" width="90" height="10" rx="3" fill="url(#paletteGrad1)" />
    <rect x="155" y="82" width="100" height="10" rx="3" fill="url(#paletteGrad2)" />

    <!-- Dividing Slider Line -->
    <line x1="140" y1="-5" x2="140" y2="145" stroke="#38BDF8" stroke-width="3" />
    <circle cx="140" cy="70" r="10" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Color Swatches -->
  <g transform="translate(90, 210)">
    <circle cx="20" cy="10" r="12" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="65" cy="10" r="12" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="110" cy="10" r="12" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="155" cy="10" r="12" fill="#EC4899" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="200" cy="10" r="12" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
  </g>

  <text x="200" y="265" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">FULL-APP SKINS &amp; FLATLAF THEMING</text>
</svg>

