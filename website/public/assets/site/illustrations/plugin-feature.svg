<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="plugCardGrad" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="coreModule" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="pluginModule" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <rect x="15" y="15" width="370" height="270" rx="16" fill="url(#plugCardGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Core Host System Block (Left) -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="120" height="110" rx="10" fill="url(#coreModule)" stroke="#38BDF8" stroke-width="2" />
    <text x="60" y="52" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" text-anchor="middle">XDM CORE</text>
    <text x="60" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#BAE6FD" text-anchor="middle">SPI Engine</text>
    <!-- Connector Tab -->
    <path d="M 120 40 C 135 40, 135 70, 120 70 Z" fill="#38BDF8" />
  </g>

  <!-- Modular Plugin Block (Right) -->
  <g transform="translate(220, 80)">
    <rect x="0" y="0" width="120" height="110" rx="10" fill="url(#pluginModule)" stroke="#60A5FA" stroke-width="2" />
    <text x="60" y="52" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">PLUGIN</text>
    <text x="60" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#E0F2FE" text-anchor="middle">.xdmplugin</text>
    <!-- Connector Notch -->
    <path d="M 0 40 C 15 40, 15 70, 0 70 Z" fill="#1E293B" />
  </g>

  <!-- Connect Dynamic Sparkles -->
  <circle cx="195" cy="55" r="4" fill="#FACC15" />
  <circle cx="205" cy="45" r="2.5" fill="#38BDF8" />
  <circle cx="185" cy="65" r="2" fill="#FFFFFF" />

  <text x="200" y="245" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">DECOUPLED JAVA PLUGIN SPI (v2)</text>
</svg>

