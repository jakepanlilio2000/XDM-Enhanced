<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="logoAccentGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="50" y1="20" x2="50" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Logo Mark (Left 100x100) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#logoBgGrad)" stroke="#38BDF8" stroke-width="2" />
    <!-- Stylized X -->
    <path d="M 25 25 L 75 75" stroke="#1D4ED8" stroke-width="14" stroke-linecap="round" />
    <path d="M 75 25 L 25 75" stroke="url(#logoAccentGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Center Download Arrow -->
    <path d="M 50 20 L 50 68 M 34 52 L 50 68 L 66 52" fill="none" stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
  </g>

  <!-- Wordmark Text (Right) -->
  <g transform="translate(130, 25)">
    <text x="0" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">XDM <tspan fill="#38BDF8">Enhanced</tspan></text>
    <text x="0" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" letter-spacing="0.2">Fast, Modular &amp; Modern Download Accelerator</text>
  </g>
</svg>

