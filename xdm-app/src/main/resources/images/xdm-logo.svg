<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGradient" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A101C" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#182640" />
    </linearGradient>

    <!-- Squircle Border Highlight -->
    <linearGradient id="borderGradient" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0.15" />
    </linearGradient>

    <!-- X - Right Arm Gradient (Under-layer) -->
    <linearGradient id="armRightGrad" x1="386" y1="126" x2="126" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>

    <!-- X - Left Arm Gradient (Cross-layer) -->
    <linearGradient id="armLeftGrad" x1="126" y1="126" x2="386" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Downward Download Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="256" y1="112" x2="256" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#BAE6FD" />
      <stop offset="65%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Drop Shadow Filter for 3D Depth -->
    <filter id="arrowShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="40" y="40" width="432" height="432" rx="104" ry="104" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="3" />

  <!-- Stylized X - Right Arm (Back Diagonal) -->
  <path d="M 336 126 C 346 126, 386 126, 386 136 L 176 386 C 166 386, 126 386, 126 376 Z" fill="url(#armRightGrad)" />

  <!-- Stylized X - Left Arm (Crossing Diagonal) -->
  <path d="M 126 136 C 126 126, 166 126, 176 126 L 386 376 C 386 386, 346 386, 336 386 Z" fill="url(#armLeftGrad)" />

  <!-- Downward Download Arrow (Integrated Hero Element) -->
  <path d="M 232 132 C 232 112, 280 112, 280 132 L 280 246 L 344 246 L 256 396 L 168 246 L 232 246 Z"
        fill="url(#arrowGrad)"
        stroke="#FFFFFF"
        stroke-opacity="0.5"
        stroke-width="1.5"
        filter="url(#arrowShadow)" />
</svg>

