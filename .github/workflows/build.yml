name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  MAVEN_OPTS: >-
    -Dhttp.keepAlive=false
    -Dmaven.wagon.http.pool=false
    -Dmaven.wagon.http.retryHandler.count=5
    -Dmaven.wagon.http.serviceUnavailableRetryCount=5
    -Dmaven.wagon.http.retryHandler.requestSentKeepAliveRuntime=5000
    -Dmaven.wagon.rto=60000

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The root pom selects the compiler via maven-toolchains-plugin (JDK 25), so register the
      # runner's JDK in ~/.m2/toolchains.xml (see packaging/toolchains.sample.xml).
      - name: Write Maven toolchains.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml <<XML
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides><version>25</version></provides>
              <configuration><jdkHome>${JAVA_HOME}</jdkHome></configuration>
            </toolchain>
          </toolchains>
          XML

      - name: Build jar
        run: |
          for attempt in 1 2 3 4 5; do
            echo ">> Building jar (attempt $attempt/5)..."
            mvn -B -pl xdm-app -am package && break || {
              if [ $attempt -eq 5 ]; then
                echo ">> Maven build failed after 5 attempts."
                exit 1
              fi
              echo ">> Transient network error encountered. Retrying in 10s..."
              sleep 10
            }
          done

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: xdm-app-jar
          path: xdm-app/target/xdm-app.jar
          if-no-files-found: error
