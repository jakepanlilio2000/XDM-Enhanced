name: Binaries

# The installers for every target in PACKAGING.md section 3.1, each built natively on its own runner. The jar is
# built once and shared. Every target links its runtime from the JDK pinned in packaging/jdk.properties, which
# the build scripts enforce; the AppCDS archive is dumped from the checked-in class list for that JDK, recorded
# on a Mac (packaging/cds/liberica.classlist: macOS and Windows; jbr.classlist: Linux), so no job records or
# needs a desktop session. A missing list means a build without an archive. The scripts link the jar into the
# runtime image as the module xdm.app (packaging/ModularJar.java), so the archive doesn't depend on file times
# and a runner's time zone doesn't matter; each build fails if its archive doesn't map (APPCDS.md).

# A tag push (v*) publishes a GitHub release with every installer; a tag with a suffix (v9.0.1-beta.1) is
# marked pre-release. A manual run only uploads the run's artifacts unless "release" is ticked; it then tags the
# commit (the "tag" input, or v<app-version.json version>, with -pre.<run number> added for a pre-release) and
# publishes a pre-release unless "prerelease" is cleared. The macOS jobs may fail without blocking the release: their dmgs can be added to it
# by hand.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release from this run
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true
      tag:
        description: Release tag (empty = v<app version>)
        type: string
        default: ''
      signing:
        description: Sign the Windows MSI with SignPath (signpath.md)
        type: choice
        options: [ unsigned, test-signing, release-signing ]
        default: unsigned
  push:
    branches: [ "master" ]
    tags: [ 'v*' ]

permissions:
  contents: write

# SignPath signing policy (signpath.md): a manual run takes the "signing" input; a tag push has no inputs and
# uses the fixed value here: unsigned until SignPath imports the production certificate, then release-signing.
# test-signing uses a self-signed test certificate: its MSIs show an untrusted publisher on Windows.
env:
  SIGNPATH_SIGNING_POLICY: ${{ github.event_name == 'push' && 'unsigned' || inputs.signing }}
  MAVEN_OPTS: >-
    -Dhttp.keepAlive=false
    -Dmaven.wagon.http.pool=false
    -Dmaven.wagon.http.retryHandler.count=5
    -Dmaven.wagon.http.serviceUnavailableRetryCount=5
    -Dmaven.wagon.http.retryHandler.requestSentKeepAliveRuntime=5000
    -Dmaven.wagon.rto=60000

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The root pom selects the compiler via maven-toolchains-plugin (JDK 25): register the runner's JDK
      # (packaging/toolchains.sample.xml).
      - name: Write Maven toolchains.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml <<XML
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides><version>25</version></provides>
              <configuration><jdkHome>${JAVA_HOME}</jdkHome></configuration>
            </toolchain>
          </toolchains>
          XML

      - name: Build jar
        run: |
          for attempt in 1 2 3 4 5; do
            echo ">> Building jar (attempt $attempt/5)..."
            mvn -B -q -pl xdm-app -am package && break || {
              if [ $attempt -eq 5 ]; then
                echo ">> Maven build failed after 5 attempts."
                exit 1
              fi
              echo ">> Transient network error encountered. Retrying in 10s..."
              sleep 10
            }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: xdm-app-jar
          path: xdm-app/target/xdm-app.jar
          if-no-files-found: error

  macos:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: xdm-app-jar
          path: xdm-app/target

      - name: Pinned Liberica JDK
        run: |
          home="$(packaging/fetch-jdk.sh "mac-${{ matrix.arch }}" | tail -1)"
          echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"

      # Spotlight and XProtect open freshly written files and make hdiutil fail with "Resource busy".
      - name: Quiet Spotlight and XProtect
        run: |
          sudo mdutil -a -i off || true
          sudo pkill -9 XProtect || true

      - name: Build dmg
        run: packaging/build-bundle.sh -s --type dmg

      - uses: actions/upload-artifact@v7
        with:
          path: build/dist/*.dmg
          archive: false
          if-no-files-found: error

  windows:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: xdm-app-jar
          path: xdm-app/target

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Installs the pinned Liberica zip and the WiX 7 CLI. -AcceptWixEula accepts the WiX 7 OSMF EULA
      # (https://wixtoolset.org/osmf/) for this runner, as setup-windows.ps1 otherwise asks on a desktop.
      - name: Pinned Liberica JDK and WiX
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\setup-windows.ps1 `
            -Arch ${{ matrix.arch }} -InstallJdk -InstallWix -AcceptWixEula
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build MSI
        shell: pwsh
        continue-on-error: true
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build-bundle.ps1 `
            -Arch ${{ matrix.arch }} -Type msi -SkipBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS Installer
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build-bundle.ps1 `
            -Arch x64 -Type nsis -SkipBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Portable Windows Zip
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $version = (Get-Content xdm-app\src\main\resources\app-version.json -Raw | ConvertFrom-Json).currentVersion
          $src = "build\dist\windows-x64\xdm-app"
          $dest = "build\dist\windows-x64\XDM-Enhanced-v$version-windows-x64.zip"
          if (Test-Path $dest) { Remove-Item $dest -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory($src, $dest, [System.IO.Compression.CompressionLevel]::Optimal, $true)

      - name: Package Browser Extensions
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File browser-extension\package-extensions.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build\dist\extensions\*.zip build\dist\windows-x64\

      # With a signing policy (SIGNPATH_SIGNING_POLICY above) the MSI is signed by SignPath Foundation (signpath.md):
      # it goes up zipped under a name without a dot, which the release job's download pattern skips, and SignPath
      # signs xdm-app.exe inside it, then the MSI, after a manual approval. "unsigned" uploads it as it is.
      - if: env.SIGNPATH_SIGNING_POLICY == 'unsigned'
        uses: actions/upload-artifact@v7
        with:
          path: |
            build/dist/windows-${{ matrix.arch }}/*.msi
            build/dist/windows-${{ matrix.arch }}/*.exe
            build/dist/windows-${{ matrix.arch }}/*.zip
          archive: false
          if-no-files-found: ignore

      - id: unsigned
        if: env.SIGNPATH_SIGNING_POLICY != 'unsigned'
        uses: actions/upload-artifact@v7
        with:
          name: msi-unsigned-${{ matrix.arch }}
          path: build/dist/windows-${{ matrix.arch }}/*.msi
          if-no-files-found: error

      - name: Sign MSI
        if: env.SIGNPATH_SIGNING_POLICY != 'unsigned'
        # v3.0, pinned by commit: it gets the SignPath token. The repo's Actions settings allow this action.
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: xdm
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY }}
          artifact-configuration-slug: msi
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # waits for the manual approval; a job may run 6 hours in all
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: build/signed/windows-${{ matrix.arch }}

      - name: Check signature
        if: env.SIGNPATH_SIGNING_POLICY != 'unsigned'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature build\signed\windows-${{ matrix.arch }}\*.msi
          $sig | Format-List Path, Status, StatusMessage
          $sig.SignerCertificate | Format-List Subject, Thumbprint, NotAfter
          if (-not $sig.SignerCertificate) { throw 'the MSI from SignPath is not signed' }

      - if: env.SIGNPATH_SIGNING_POLICY != 'unsigned'
        uses: actions/upload-artifact@v7
        with:
          path: build/signed/windows-${{ matrix.arch }}/*.msi
          archive: false
          if-no-files-found: error

  linux:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: xdm-app-jar
          path: xdm-app/target

      # Docker image with the pinned JBR (passed from packaging/jdk.properties) and nfpm.
      - name: Build packages
        run: packaging/build-linux.sh -s --arch ${{ matrix.arch }}

      # One upload per file: an unarchived artifact holds a single file (its name), so the downloads
      # aren't zips.
      - uses: actions/upload-artifact@v7
        with:
          path: build/linux-${{ matrix.arch }}/*.deb
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: build/linux-${{ matrix.arch }}/*.rpm
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: build/linux-${{ matrix.arch }}/*.pkg.tar.zst
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: build/linux-${{ matrix.arch }}/*.tar.gz
          archive: false
          if-no-files-found: error

  release:
    needs: [ macos, windows, linux ]
    if: >-
      always() && needs.jar.result == 'success' && !cancelled() &&
      (github.event_name == 'push' || inputs.release != false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The installers land in dist/ as they are. Their artifacts are unarchived, so each is named after its
      # file and has a dot; the jar and the unsigned MSIs (xdm-app-jar, msi-unsigned-<arch>) have none.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '*.*'
          merge-multiple: true

      # XDM 8 from the Microsoft Store looks for xdmsetup-<v>.msi in the release for its update notice, so the x64 MSI
      # also goes up under that name (after signing: a byte copy, the signature stays valid).
      - name: Copy x64 MSI for XDM 8 Store update notice
        run: |
          shopt -s nullglob
          msi=(dist/xdm-*-x64.msi)
          if [[ ${#msi[@]} -ge 1 ]]; then
            v="${msi[0]##*/xdm-}"; v="${v%-x64.msi}"
            cp "${msi[0]}" "dist/xdmsetup-$v.msi"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="$(sed -n 's/.*"currentVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
            xdm-app/src/main/resources/app-version.json | head -1)"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then
              tag="$GITHUB_REF_NAME"
            else
              tag="v$version"
            fi
            [[ "$tag" == *-* ]] && pre=true || pre=false
          else
            pre="$INPUT_PRERELEASE"
            if [[ "$pre" == true ]]; then
              tag="${INPUT_TAG:-v$version-pre.$GITHUB_RUN_NUMBER}"
            else
              tag="${INPUT_TAG:-v$version}"
            fi
          fi
          shopt -s nullglob
          files=(dist/*.dmg dist/*.msi dist/*.exe dist/*.zip dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.tar.gz)
          ls -la "${files[@]}" || true
          # Download table: one row per installer actually built (a failed macOS job just has no rows).
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag"
          {
            echo "## Downloads"
            echo
            echo "| Asset | Description |"
            echo "|---|---|"
            for f in "${files[@]}"; do
              name="${f##*/}"
              case "$name" in *arm64*|*aarch64*) cpu=ARM; mac="Apple Silicon (M1 or later)" ;; *) cpu=x64; mac=Intel ;; esac
              case "$name" in
                *Setup*.exe)              note="Windows x64 NSIS Setup Installer (Recommended)" ;;
                *Extension-Chromium*.zip) note="Chromium Browser Extension (Chrome, Edge, Brave, Opera, Vivaldi)" ;;
                *Extension-Firefox*.zip)  note="Firefox Browser Extension (Firefox, Floorp, LibreWolf)" ;;
                *windows*.zip)            note="Windows $cpu Portable (Standalone directory, no install)" ;;
                xdmsetup-*.msi)           note="Same as the x64 MSI; for legacy XDM 8 update notices" ;;
                *.msi)                    note="Windows $cpu MSI Installer" ;;
                *.dmg)                    note="For $mac mac" ;;
                *.deb)                    note="For Debian / Ubuntu / Linux Mint $cpu" ;;
                *.rpm)                    note="For Fedora / RHEL / openSUSE $cpu" ;;
                *.pkg.tar.zst)            note="For Arch Linux / Manjaro $cpu" ;;
                *.tar.gz)                 note="For any Linux $cpu (portable, no install)" ;;
                *)                        note="" ;;
              esac
              echo "| [$name]($base/$name) | $note |"
            done
            echo
            # SignPath Foundation requires a "Code signing policy" link on every release page.
            echo "[Code signing policy]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/master/CODE_SIGNING_POLICY.md)"
          } > downloads.md
          cat downloads.md
          flags=(--title "XDM Enhanced ${tag#v}" --target "$GITHUB_SHA")
          [[ "$pre" == true ]] && flags+=(--prerelease) || flags+=(--latest)
          
          if [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md > notes.md
            echo "" >> notes.md
            cat downloads.md >> notes.md
          else
            changelog="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -q .body | grep '^\*\*Full Changelog\*\*' || true)"
            { cat downloads.md; [[ -z "$changelog" ]] || printf "\n## What's Changed\n\n%s\n" "$changelog"; } > notes.md
          fi
          
          # A release drafted on the GitHub web page pushes its tag and already exists: attach the files and
          # put the table above the notes written there (replacing a table from an earlier run).
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${files[@]}"
            gh release edit "$tag" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$tag" "${flags[@]}" --notes-file notes.md "${files[@]}"
          fi
