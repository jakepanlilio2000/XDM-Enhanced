<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <script src="error.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="app-header">
        <h1>XDM Enhanced Integration</h1>
    </header>

    <div class="page-body">
        <div class="notice warn" id="notice">
            <h2 id="status">XDM Enhanced isn't running</h2>
            <p id="detail">Start XDM Enhanced to capture downloads and videos from this page.</p>
            <p class="version-hint" id="versionHint">Works with XDM Enhanced v1.0.0 and higher. Using an older
                version? <a href="https://github.com/jakepanlilio2000/XDM-Enhanced/releases" target="_blank"
                    rel="noopener">Get the latest release</a>.</p>
        </div>
        <div class="button-row" id="actions" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <button class="primary-button" id="OpenLink" type="button">Launch XDM Enhanced</button>
            <button class="secondary-button" id="recheckBtn" type="button">Recheck Connection</button>
            <a href="https://github.com/jakepanlilio2000/XDM-Enhanced/blob/master/docs/BROWSER_CONNECTION_TROUBLESHOOTING.md" target="_blank" rel="noopener" id="troubleshootLink" class="secondary-button" style="text-decoration: none; display: inline-flex; align-items: center;">Troubleshooting Guide →</a>
        </div>
    </div>
</body>

</html>
